<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fbSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1428"/>
      <stop offset="55%" stop-color="#2a2340"/>
      <stop offset="100%" stop-color="#3d3550"/>
    </linearGradient>
    <linearGradient id="fbGrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f7a4a"/>
      <stop offset="100%" stop-color="#234832"/>
    </linearGradient>
    <linearGradient id="fbGrassNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f9258"/>
      <stop offset="100%" stop-color="#2a5536"/>
    </linearGradient>
    <radialGradient id="fbThicketGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5b8f63" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5b8f63" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fbBerrySheen" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="fbSoftBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#fbSky)"/>

  <!-- Cool pre-dawn mist over plains -->
  <ellipse cx="800" cy="610" rx="940" ry="170" fill="#2f3a48" opacity="0.42"/>

  <!-- Distant rolling hills -->
  <path d="M0 570 Q260 520 520 555 T980 535 T1400 560 T1600 545 L1600 900 L0 900 Z" fill="#33463f" opacity="0.72"/>
  <path d="M0 600 Q340 560 680 585 T1180 565 T1600 595 L1600 900 L0 900 Z" fill="#2a3d36" opacity="0.82"/>

  <!-- Main grassy field -->
  <rect x="0" y="630" width="1600" height="270" fill="url(#fbGrass)"/>

  <!-- Low thicket  central find -->
  <g id="thicket">
    <ellipse cx="800" cy="560" rx="280" ry="120" fill="url(#fbThicketGlow)" filter="url(#fbSoftBlur)"/>
    <path d="M560 650 Q620 470 760 500 Q800 430 900 490 Q1040 455 1040 650 Z" fill="#1f4d2d"/>
    <path d="M590 645 Q650 510 760 535 Q820 470 910 520 Q990 495 1010 640" fill="none" stroke="#163b24" stroke-width="10" stroke-linecap="round"/>
    <path d="M620 640 Q700 540 790 565 Q850 510 930 555 Q980 530 1000 635" fill="none" stroke="#245a34" stroke-width="6" stroke-linecap="round" opacity="0.75"/>

    <!-- Ripe berry clusters -->
    <g id="berries-center">
      <circle cx="700" cy="545" r="13" fill="#7f1d1d"/>
      <circle cx="696" cy="541" r="4.5" fill="url(#fbBerrySheen)"/>
      <circle cx="728" cy="525" r="12" fill="#991b1b"/>
      <circle cx="724" cy="521" r="4" fill="url(#fbBerrySheen)"/>
      <circle cx="758" cy="548" r="14" fill="#581c87"/>
      <circle cx="754" cy="544" r="4.5" fill="url(#fbBerrySheen)"/>
      <circle cx="790" cy="520" r="13" fill="#1e3a8a"/>
      <circle cx="786" cy="516" r="4" fill="url(#fbBerrySheen)"/>
      <circle cx="822" cy="542" r="12" fill="#7f1d1d"/>
      <circle cx="818" cy="538" r="4" fill="url(#fbBerrySheen)"/>
      <circle cx="858" cy="528" r="13" fill="#581c87"/>
      <circle cx="854" cy="524" r="4.5" fill="url(#fbBerrySheen)"/>
      <circle cx="892" cy="550" r="11" fill="#991b1b"/>
      <circle cx="888" cy="546" r="3.5" fill="url(#fbBerrySheen)"/>
      <circle cx="740" cy="575" r="10" fill="#1e3a8a"/>
      <circle cx="736" cy="571" r="3.5" fill="url(#fbBerrySheen)"/>
      <circle cx="810" cy="568" r="11" fill="#7f1d1d"/>
      <circle cx="806" cy="564" r="3.5" fill="url(#fbBerrySheen)"/>
      <circle cx="870" cy="572" r="10" fill="#581c87"/>
      <circle cx="866" cy="568" r="3" fill="url(#fbBerrySheen)"/>
    </g>

    <!-- Dew / cool night air highlights -->
    <circle cx="712" cy="538" r="2" fill="#dbeafe" opacity="0.7"/>
    <circle cx="768" cy="532" r="1.8" fill="#dbeafe" opacity="0.65"/>
    <circle cx="834" cy="536" r="2" fill="#dbeafe" opacity="0.7"/>
    <circle cx="884" cy="544" r="1.6" fill="#dbeafe" opacity="0.6"/>

    <ellipse cx="800" cy="645" rx="220" ry="22" fill="#163b24" opacity="0.35"/>
  </g>

  <!-- Foreground grass tufts -->
  <g fill="#2f6840" opacity="0.9">
    <path d="M0 710 Q8 670 16 710 Q24 680 32 710 Q40 675 48 710 L48 730 L0 730 Z"/>
    <path d="M80 760 Q88 720 96 760 Q104 730 112 760 Q120 725 128 760 L128 780 L80 780 Z"/>
    <path d="M1470 730 Q1478 690 1486 730 Q1494 700 1502 730 Q1510 695 1518 730 L1518 750 L1470 750 Z"/>
    <path d="M1540 770 Q1548 730 1556 770 Q1564 740 1572 770 Q1580 735 1588 770 L1588 790 L1540 790 Z"/>
  </g>

  <!-- Low foreground bramble hints -->
  <g opacity="0.85">
    <path d="M120 820 Q150 760 190 790 Q220 745 250 805 Q210 855 150 845 Q120 835 120 820 Z" fill="#1f4d2d"/>
    <circle cx="158" cy="785" r="8" fill="#991b1b"/>
    <circle cx="155" cy="782" r="2.5" fill="#fecaca" opacity="0.75"/>
    <circle cx="198" cy="772" r="7" fill="#581c87"/>
    <circle cx="195" cy="769" r="2" fill="#e9d5ff" opacity="0.75"/>

    <path d="M1350 815 Q1380 755 1420 785 Q1450 740 1480 800 Q1440 850 1380 840 Q1350 830 1350 815 Z" fill="#1f4d2d"/>
    <circle cx="1388" cy="780" r="8" fill="#7f1d1d"/>
    <circle cx="1385" cy="777" r="2.5" fill="#fecaca" opacity="0.75"/>
    <circle cx="1428" cy="768" r="7" fill="#1e3a8a"/>
    <circle cx="1425" cy="765" r="2" fill="#bfdbfe" opacity="0.75"/>
  </g>

  <!-- Near foreground grass overlay -->
  <rect x="0" y="790" width="1600" height="110" fill="url(#fbGrassNear)" opacity="0.55"/>
  <path d="M0 830 Q400 800 800 820 T1600 810 L1600 900 L0 900 Z" fill="#245a34" opacity="0.42"/>
</svg>
