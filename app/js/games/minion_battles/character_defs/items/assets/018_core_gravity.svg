    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="24" fill="url(#gravityCoreFill)" stroke="#a855f7" stroke-width="5" filter="url(#gravityGlow)" opacity="0.9"/>
  <ellipse cx="32" cy="32" rx="8" ry="8" fill="#a855f7" opacity="0.4"/>
</svg>
